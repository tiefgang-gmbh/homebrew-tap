# Homebrew's tap-syntax checks (style, readall, audit) on every push the
# release workflow makes. This file is written into tiefgang-gmbh/homebrew-tap
# by infra/pulumi/release (a RepositoryFile resource); edit it there, never
# in the tap.
name: tap-syntax

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tap-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The runner image carries Homebrew under /home/linuxbrew but not on
      # PATH (Homebrew's own setup action, which would add it, is published
      # from a branch only — no tag to pin).
      - name: Put Homebrew on PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      # The runner's Homebrew must see this checkout as the tap. test-bot
      # trusts the tap under test itself before its checks (Homebrew 6+
      # tap trust), so nothing here needs to.
      - name: Tap this checkout
        run: brew tap tiefgang-gmbh/tap "$GITHUB_WORKSPACE"

      # test-bot is a built-in developer command since its tap
      # (homebrew/test-bot) was emptied and deprecated.
      - name: Tap syntax
        run: brew test-bot --only-tap-syntax --tap=tiefgang-gmbh/tap
